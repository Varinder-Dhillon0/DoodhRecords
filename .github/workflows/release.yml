name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Bump release versions
        run: node scripts/prepare-release.mjs ${{ github.ref_name }}

      - name: Preflight self-update requirements
        run: >
          node -e "const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('./app.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('./version.json','utf8')).android;
          const man=fs.readFileSync('android/app/src/main/AndroidManifest.xml','utf8');
          const perms=a.expo?.android?.permissions ?? [];
          const appCode=a.expo?.android?.versionCode;
          const g=fs.readFileSync('android/app/build.gradle','utf8').match(/versionCode\s+(\d+)/);
          const gradleCode=g?Number(g[1]):NaN;
          if(!perms.includes('REQUEST_INSTALL_PACKAGES')){console.error('PREFLIGHT FAIL: android.permissions is missing REQUEST_INSTALL_PACKAGES');process.exit(1);}
          if(!man.includes('android.permission.REQUEST_INSTALL_PACKAGES')){console.error('PREFLIGHT FAIL: android manifest is missing REQUEST_INSTALL_PACKAGES — the built APK cannot request installs');process.exit(1);}
          if(!Number.isInteger(appCode)||appCode<1){console.error('PREFLIGHT FAIL: android.versionCode must be a positive integer');process.exit(1);}
          if(gradleCode!==appCode){console.error('PREFLIGHT FAIL: build.gradle versionCode ('+gradleCode+') != app.json versionCode ('+appCode+') — gate never clears');process.exit(1);}
          if(manifest?.minVersionCode!==appCode){console.error('PREFLIGHT FAIL: version.json minVersionCode ('+(manifest?.minVersionCode??'?')+') != app.json versionCode ('+appCode+')');process.exit(1);}
          console.log('preflight ok: versionCode '+appCode+', install permission declared in native manifest');"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build release APK
        run: eas build --platform android --profile production --non-interactive --wait --json > build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK artifact
        run: |
          url=$(node -e "const b = JSON.parse(require('fs').readFileSync('build.json','utf8')); const first = Array.isArray(b) ? b[0] : b; console.log(first?.artifacts?.buildUrl ?? '')")
          test -n "$url"
          curl -L "$url" -o doodhrecords.apk

      - name: Publish GitHub Release
        run: gh release create ${{ github.ref_name }} doodhrecords.apk --title ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bumps
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add app.json package.json package-lock.json version.json android/app/build.gradle
          git commit -m "chore(release): ${{ github.ref_name }} [skip ci]" || echo "nothing to commit"
          git fetch origin main
          git rebase origin/main || (git rebase --abort && echo "rebase failed: main moved unexpectedly" && exit 1)
          git push origin HEAD:main
